<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runagotchi</title>
<style>
@font-face{font-family:Fredoka;font-style:normal;font-weight:400;font-display:swap;src:url(fonts/fredoka-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Fredoka;font-style:normal;font-weight:500;font-display:swap;src:url(fonts/fredoka-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Fredoka;font-style:normal;font-weight:600;font-display:swap;src:url(fonts/fredoka-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Fredoka;font-style:normal;font-weight:700;font-display:swap;src:url(fonts/fredoka-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/dm-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/dm-mono-latin-500-normal.woff2) format('woff2')}

:root{
  --bg:#f5efe3; --card:#fffaf1; --ink:#22201b; --muted:#77705f; --line:#e6dccb;
  --accent:#ff6b35; --accent-ink:#fff; --good:#2f9e6b; --warn:#e3a008; --bad:#d64545;
  --lcd:#cfdcb8; --lcd-ink:#3d4a2c; --shell:#ff8f6b;
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Fredoka,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
.mono{font-family:"DM Mono",ui-monospace,monospace}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 60px}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.brand{font-weight:700;font-size:22px;letter-spacing:-.3px}
.brand span{color:var(--accent)}
.save-status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.cloud{background:var(--good)}

/* device */
.device{position:relative;margin:4px auto 0;width:100%;max-width:360px;aspect-ratio:1/1.08;
  background:radial-gradient(120% 90% at 30% 20%, #ffb898 0%, var(--shell) 45%, #f0704a 100%);
  border-radius:50% 50% 46% 46% / 56% 56% 44% 44%;box-shadow:inset -10px -16px 0 rgba(0,0,0,.08), inset 8px 10px 0 rgba(255,255,255,.25), 0 14px 30px rgba(120,60,20,.18);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14% 13% 12%}
.screen{width:100%;aspect-ratio:1/1;border-radius:22px;background:var(--lcd);position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 4px rgba(0,0,0,.12), inset 0 6px 14px rgba(0,0,0,.12);
  background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px),repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px)}
.screen > svg,.screen .petlayer > svg{position:absolute;inset:6% 6% 4%;width:88%;height:90%}
.screen .lv{position:absolute;top:10px;left:12px;font-size:12px;color:var(--lcd-ink);font-family:"DM Mono",monospace}
.screen .clock{position:absolute;top:10px;right:12px;font-size:12px;color:var(--lcd-ink);font-family:"DM Mono",monospace}
.screen.dead{filter:grayscale(.7)}
.float-txt{position:absolute;left:50%;top:40%;transform:translateX(-50%);font-weight:700;color:var(--lcd-ink);font-size:22px;animation:floatUp 1.6s ease-out forwards;pointer-events:none}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-60px)}}
.hunger{display:flex;gap:4px;margin-top:12px;width:100%}
.hunger i{flex:1;height:12px;border-radius:4px;background:rgba(0,0,0,.14)}
.hunger i.on{background:#fff}
.hunger.low i.on{background:#ffe08a}
.hunger.crit i.on{background:#ffd0d0}

/* 2.5D: --tx/--ty (-1..1) come from the gyroscope, the mouse or an idle sway */
.stage3d{--tx:0;--ty:0;position:relative;perspective:900px;padding:4px 0 18px}
.stage3d .device{transform-style:preserve-3d;will-change:transform;
  transform:rotateY(calc(var(--tx) * 11deg)) rotateX(calc(var(--ty) * -9deg));
  box-shadow:inset calc(-10px - var(--tx) * 6px) calc(-16px - var(--ty) * 6px) 0 rgba(0,0,0,.08), inset calc(8px - var(--tx) * 4px) calc(10px - var(--ty) * 4px) 0 rgba(255,255,255,.25),
    calc(var(--tx) * -14px) calc(16px + var(--ty) * -8px) 30px rgba(120,60,20,.2)}
.stage3d .device::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(38% 30% at calc(32% - var(--tx) * 14%) calc(18% - var(--ty) * 12%), rgba(255,255,255,.45), rgba(255,255,255,0) 70%)}
.stage3d .screen{transform:translateZ(2px);box-shadow:inset 0 0 0 4px rgba(0,0,0,.12), inset calc(var(--tx) * -8px) calc(6px + var(--ty) * -8px) 14px rgba(0,0,0,.14);
  background-position:calc(var(--tx) * -3px) calc(var(--ty) * -3px)}
.stage3d .glass{position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(calc(115deg + var(--tx) * 18deg), rgba(255,255,255,0) 30%, rgba(255,255,255,.22) 46%, rgba(255,255,255,0) 60%);
  background-size:200% 200%;background-position:calc(50% - var(--tx) * 30%) calc(50% - var(--ty) * 30%)}
.stage3d .hunger{transform:translateZ(8px)}
.stage3d::after{content:"";position:absolute;left:50%;bottom:4px;width:60%;max-width:220px;height:16px;border-radius:50%;
  background:radial-gradient(closest-side, rgba(120,60,20,.22), rgba(120,60,20,0));transform:translateX(calc(-50% + var(--tx) * -14px));pointer-events:none}
/* garden room: one 3D world; only the camera moves (the world orbits around the pet) */
.room{position:absolute;inset:0;overflow:hidden;perspective:420px;perspective-origin:50% 38%}
.world{position:absolute;inset:0;transform-style:preserve-3d;transform-origin:50% 80% 0;
  transform:rotateX(calc(var(--ty) * -6deg)) rotateY(calc(var(--tx) * 11deg))}
.world > *{position:absolute;pointer-events:none}
.world svg{display:block;width:100%;height:100%}
.room{background:linear-gradient(180deg,var(--sk1) 0%,var(--sk2) 46%,#8fcf74 46%,#7cc862 60%,#77c75a 100%)}
.room.night{background:radial-gradient(1.2px 1.2px at 20% 30%,#fff 50%,transparent) 0 0/60px 50px,radial-gradient(1px 1px at 60% 50%,#fff 50%,transparent) 0 0/80px 70px,
  linear-gradient(180deg,var(--sk1) 0%,var(--sk2) 46%,#5f9a52 46%,#58934c 100%)}
.room .floor{left:-250%;width:600%;top:80%;height:2600px;transform-origin:50% 0;transform:translateZ(-2200px) rotateX(90deg);
  background:repeating-linear-gradient(90deg,#7dd05f 0 26px,#72c656 26px 52px)}
.room .floor .pond{position:absolute;left:52.5%;top:1980px;width:7%;height:110px;border-radius:50%;
  background:radial-gradient(60% 60% at 45% 40%,#bfeaff,#58b8f0 70%,#3a9ad8);box-shadow:0 0 0 6px #d9cba4, 0 0 0 9px #bfae84}
.room .floor .path{position:absolute;left:49.2%;top:1700px;width:1.6%;height:520px;border-radius:30px;background:#e3d3a3}
/* billboards: bottom edge sits on the ground line (80%), centred on --x */
.room .bb.air{height:var(--h);align-items:flex-start}
.room .bb{bottom:20%;left:calc(var(--x) - var(--w) / 2);width:var(--w);height:80%;transform:translateZ(var(--z));display:flex;align-items:flex-end}
.room .bb svg{height:auto;max-height:100%}
.room .bb.hills{height:150%}
.room .bb.hills svg{height:30%;width:100%}
.room .bb.petbb{height:76%}
.room .bb.petbb svg{height:100%;margin-bottom:-9%}
.room{--sk1:#7fcaff;--sk2:#dff5ff}
.room .sun{fill:#fff3a6}
.room.dawn{--sk1:#9ccaf0;--sk2:#ffe2c4}
.room.dusk{--sk1:#6d7fd6;--sk2:#ffb48a}.room.dusk .sun{fill:#ffcf7a}.room.dusk .sunbb{--h:95%}
.room.night{--sk1:#1c2a5c;--sk2:#4a5f9c}.room.night .sun{fill:#f4f1d8}.room.night .sunbb{--w:14%}
.room.night .cloudbb{opacity:.25}
.room.night .floor,.room.night .bb:not(.air){filter:brightness(.72) saturate(.85)}
.fallflow{animation:fall 1.1s linear infinite}
@keyframes fall{to{stroke-dashoffset:-15}}
@media (prefers-reduced-motion:reduce){.fallflow{animation:none}}
.stage3d .screen .lv,.stage3d .screen .clock{z-index:4;background:rgba(255,255,255,.72);color:var(--ink);border-radius:999px;padding:1px 7px;top:8px;transform:none}
.stage3d .screen .lv{left:8px}.stage3d .screen .clock{right:8px}
.stage3d .glass{z-index:5}
.screen .float-txt{z-index:6}
.tilthint{display:block;margin:10px auto 0;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;color:var(--muted)}
.petname{text-align:center;margin:16px 0 2px;font-size:26px;font-weight:700;letter-spacing:-.4px}
.status{text-align:center;color:var(--muted);font-size:15px;min-height:22px;padding:0 10px}
.status b{color:var(--ink);font-weight:600}
.status.bad b{color:var(--bad)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat .v{font-family:"DM Mono",monospace;font-size:20px;font-weight:500}
.stat .k{font-size:12px;color:var(--muted)}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:600;font-size:16px;background:var(--card);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 4px 0 #d9542a}
.btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #d9542a}
.btn.dark{background:var(--ink);color:#fff;border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}

section.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
section.card h2{font-size:17px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.runs{list-style:none;margin:0;padding:0}
.runs li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.runs li:first-child{border-top:0}
.runs .km{font-family:"DM Mono",monospace;font-size:17px;min-width:76px}
.runs .meta{flex:1;font-size:13px;color:var(--muted);line-height:1.35}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:#eee4d3;color:#6b5f48;margin-left:4px}
.badge.coros{background:#e3ecff;color:#2d4f9e}
.badge.pre{background:#f3e3e3;color:#9e3d3d}
.x{border:0;background:transparent;font-size:20px;color:var(--muted);padding:4px 8px;border-radius:8px}
.x:hover{background:#efe6d6}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

.coros-logo{font-weight:700;letter-spacing:1px;font-size:13px;background:#111;color:#fff;padding:3px 8px;border-radius:6px}
ol.steps{padding-left:20px;margin:8px 0 12px;font-size:14px;line-height:1.5}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted);font-size:14px;transition:.15s}
.drop.over{border-color:var(--accent);background:#fff1ea;color:var(--ink)}
.drop label{color:var(--accent);font-weight:600;cursor:pointer}
.note{font-size:13px;background:#f3ecdf;border-radius:12px;padding:10px 12px;margin-top:12px;color:#5d5546;line-height:1.45}

details.settings summary{cursor:pointer;font-weight:600;list-style:none}
details.settings summary::-webkit-details-marker{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* creator */
.creator .preview{width:200px;height:200px;margin:0 auto;border-radius:24px;background:var(--lcd);position:relative;
  background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px),repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px)}
.creator .preview svg{width:100%;height:100%}
.field{margin-top:18px}
.field > label, .field > .lbl{display:block;font-weight:600;margin-bottom:8px;font-size:15px}
.text{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:17px}
.text:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-size:14px}
.chip svg{width:40px;height:40px}
.chip.sel{border-color:var(--ink)}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line)}
.sw.sel{box-shadow:0 0 0 3px var(--ink)}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diff .chip{flex-direction:column;align-items:flex-start;gap:2px;padding:10px}
.diff .chip b{font-size:15px}
.diff .chip span{font-size:12px;color:var(--muted)}
.hero{text-align:center;margin:6px 0 16px}
.hero h1{font-size:28px;margin:0 0 4px;letter-spacing:-.5px}
.hero p{margin:0;color:var(--muted)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(30,25,15,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.backdrop.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:20px 18px 28px;max-height:90vh;overflow:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet h3{margin:0 0 12px;font-size:20px}
.sheet .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;max-width:92vw;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;line-height:1.4}
.toast.show{display:block;animation:up .2s}


/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#ece3d2;border-radius:14px;padding:4px;margin:0 0 16px}
.tabs button{border:0;background:transparent;border-radius:10px;padding:9px;font-weight:600;font-size:15px;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:grid;grid-template-columns:repeat(4,1fr);max-width:480px;margin:0 auto;
  background:rgba(255,251,243,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(60,40,10,.06)}
@media (min-width:481px){.bottomnav{border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}}
.bottomnav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;border-radius:12px;color:var(--muted);font:inherit;font-weight:600;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bottomnav .ni{position:relative;display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:999px;transition:background .15s}
.bottomnav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bottomnav svg .dot{fill:currentColor;stroke:none}
.bottomnav button.on{color:var(--ink)}
.bottomnav button.on .ni{background:#ffe1d3;color:var(--accent)}
.bottomnav .pill{position:absolute;top:-4px;right:2px;margin:0;min-width:18px;line-height:18px;font-size:11px;padding:0 5px}
body.hasnav .wrap{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body.hasnav .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
.scene{isolation:isolate}
.pill{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;line-height:20px;margin-left:4px}

/* auth */
.auth .mini{width:150px;height:150px;margin:6px auto 4px;border-radius:24px;background:var(--lcd);
  background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px),repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px)}
.auth .mini svg{width:100%;height:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#ece3d2;border-radius:12px;padding:4px;margin-bottom:6px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink)}
.invl{list-style:none;margin:10px 0 0;padding:0}
.invl li{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #ece3d2}
.invl code{font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:6px 0;font-size:14px}
.center{text-align:center}
.ok{color:var(--good);font-size:14px;margin-top:6px}
.ok:empty{display:none}
.at{position:relative}
.at span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px}
.at input{padding-left:30px}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite;margin:120px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* friends */
.addrow{display:flex;gap:8px}
.addrow .at{flex:1}
.req{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.req .who{flex:1;font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;position:relative}
.fcard .scr{aspect-ratio:1/1;border-radius:12px;background:var(--lcd);
  background-image:repeating-linear-gradient(0deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px),repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 1px, transparent 1px 4px)}
.fcard .scr.dead{filter:grayscale(.7)}
.fcard .scr svg{width:100%;height:100%}
.fcard .nm{font-weight:700;margin-top:8px;font-size:16px;line-height:1.1}
.fcard .un{font-size:12px;color:var(--muted)}
.fcard .st{font-size:13px;margin-top:4px;line-height:1.3}
.fcard .st.bad{color:var(--bad)}
.fcard .lv{position:absolute;top:16px;left:16px;font-family:"DM Mono",monospace;font-size:10px;color:var(--lcd-ink)}
.fcard .more{position:absolute;top:12px;right:12px;border:0;background:rgba(255,255,255,.7);border-radius:8px;padding:0 7px;font-size:16px;color:var(--muted)}
.minibar{display:flex;gap:2px;margin-top:6px}
.minibar i{flex:1;height:6px;border-radius:2px;background:#ece3d2}
.minibar i.on{background:var(--good)}
.minibar.low i.on{background:var(--warn)}
.minibar.crit i.on{background:var(--bad)}


.tabs.three{grid-template-columns:1fr 1.3fr 1fr}
.actions.single{grid-template-columns:1fr}

/* run together */
.scene{position:relative;height:340px;border-radius:22px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.scene .layer{position:absolute;left:0;right:0;background-repeat:repeat-x;animation-timing-function:linear;animation-iteration-count:infinite}
.l-clouds{top:14px;height:120px;animation-name:sc600;animation-duration:70s}
.l-far{bottom:118px;height:140px;animation-name:sc800;animation-duration:48s}
.l-near{bottom:92px;height:110px;animation-name:sc600;animation-duration:22s}
.l-trees{bottom:90px;height:110px;animation-name:sc360;animation-duration:9s}
.l-track{bottom:0;height:96px;animation-name:sc160;animation-duration:.9s}
@keyframes sc160{to{background-position-x:-160px}}
@keyframes sc360{to{background-position-x:-360px}}
@keyframes sc600{to{background-position-x:-600px}}
@keyframes sc800{to{background-position-x:-800px}}
.sun{position:absolute;top:26px;right:44px;width:54px;height:54px;border-radius:50%;background:#fff3b0;box-shadow:0 0 0 10px rgba(255,243,176,.35),0 0 40px rgba(255,220,120,.8)}

.runner{position:absolute;transform:translateX(-50%);transition:left 1.2s ease,bottom 1.2s ease}
.runner svg{width:100%;height:auto;display:block;overflow:visible}
.scene .tag{position:absolute;z-index:40;transform:translateX(-50%);white-space:nowrap;font-size:10.5px;font-weight:600;background:rgba(255,255,255,.9);color:var(--ink);padding:1px 6px;border-radius:999px;max-width:96px;overflow:hidden;text-overflow:ellipsis;transition:left 1.2s ease,bottom 1.2s ease;box-shadow:0 1px 2px rgba(0,0,0,.12)}

.m-run{animation:runbob var(--spd,.5s) ease-in-out infinite}
.m-run .fl{animation:footL var(--spd,.5s) ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.m-run .fr{animation:footR var(--spd,.5s) ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes runbob{0%,100%{transform:translateY(0) rotate(5deg)}50%{transform:translateY(-12px) rotate(7deg)}}
@keyframes footL{0%,100%{transform:translate(8px,0)}50%{transform:translate(-8px,-6px)}}
@keyframes footR{0%,100%{transform:translate(-8px,-6px)}50%{transform:translate(8px,0)}}
.dust{position:absolute;left:-8%;bottom:10%;width:30%;height:30%}

.dust i:nth-child(2){animation-delay:calc(var(--spd,.5s) / -3);width:10px;height:10px}
.dust i:nth-child(3){animation-delay:calc(var(--spd,.5s) / -1.5);width:8px;height:8px}

.scene.night .runner svg{filter:brightness(.88)}
ol.pack{list-style:none;margin:0;padding:0}

.tabs.four{grid-template-columns:.9fr .7fr 1.15fr 1fr}
.tabs.four button{font-size:14px;padding:9px 4px}

/* challenges */
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.ch-title{font-size:18px;font-weight:700;letter-spacing:-.2px}
.ch.done{opacity:.92}
ol.rank{list-style:none;margin:0;padding:0}
ol.rank li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
ol.rank li:first-child{border-top:0}
ol.rank .rk{width:22px;text-align:center;font-family:"DM Mono",monospace;font-size:14px;color:var(--muted);flex:none}
ol.rank li.me .rk{color:var(--accent);font-weight:600}
.av{width:38px;height:38px;border-radius:10px;background:var(--lcd);flex:none;overflow:hidden;display:grid;place-items:center}
.av svg{width:100%;height:100%}
.av.empty{font-weight:700;color:var(--lcd-ink)}
ol.rank .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
ol.rank .line{display:flex;justify-content:space-between;gap:8px}
ol.rank .pct{font-family:"DM Mono",monospace;font-size:14px}
ol.rank .pct.full{color:var(--good);font-weight:600}
.pbar{height:8px;border-radius:5px;background:#ece3d2;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#ffb08a,var(--accent))}
li.me .pbar i{background:linear-gradient(90deg,#ff8a5c,#e8501f)}
.cheer{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.cheer.kudos{border-color:#f0c36b;background:#fff7e3}
.cheer.encourage{border-color:#9fd1b4;background:#eefaf3}
.cheer.sent{opacity:.6}
.cheer:disabled{opacity:.4}
.waiting{margin-top:8px}
details.past{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
details.past summary{cursor:pointer;list-style:none;font-size:16px}
details.past summary::-webkit-details-marker{display:none}
details.past .card{margin:12px 0 0;border:0;padding:0;background:transparent}


/* watches */
.wrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wrow:first-of-type{border-top:0}
.wlogo{width:72px;flex:none;font-weight:700;font-size:13px;letter-spacing:.5px;text-align:center;padding:6px 0;border-radius:8px;color:#fff;background:#111}

.wlogo.suunto{background:#222;letter-spacing:1.5px}
.wlogo.coros{background:#e3241b}
.wstat{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.wbtns{display:flex;gap:6px}
.ok-dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.badge.watch{background:#e3ecff;color:#2d4f9e}
.wstat span{display:flex;flex-direction:column;gap:2px}
.diag{padding:0;font-size:12px;text-align:left;color:var(--muted)}
.diag-out{background:#f3ecdf;border-radius:10px;padding:10px;font-size:11px;max-height:45vh;overflow:auto;white-space:pre-wrap;word-break:break-all;font-family:"DM Mono",monospace}


/* running together */
.runs .with{display:block;color:#b4531f;font-size:12px;margin-top:2px}
.x.bud{font-size:16px}
.blink{position:absolute;z-index:38;height:0;border-top:3px dashed rgba(255,107,53,.85);transform:translateY(50%);transition:left 1.2s ease,width 1.2s ease,bottom 1.2s ease;pointer-events:none}
.blink span{position:absolute;left:50%;top:-13px;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.2);animation:budpulse 1.6s ease-in-out infinite}
@keyframes budpulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.15)}}
.bud-note{color:#b4531f}
.budbadge{display:inline-block;margin-top:4px;font-size:11px;font-weight:600;color:#b4531f;background:#fff1ea;border-radius:999px;padding:2px 8px}

/* running group name */
.packname{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rename{font-size:14px;padding:2px 4px}
.scene-title{position:absolute;top:12px;left:12px;z-index:45;border:0;background:rgba(255,255,255,.85);border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* debug */
section.card.dbg{border:2px dashed #c9b28a;background:#fffdf6}
.dbg-row{padding:10px 0;border-top:1px solid var(--line)}
.dbg-row:first-of-type{border-top:0}
.dbg-who{display:flex;flex-direction:column;margin-bottom:6px}
.chip.small{padding:5px 10px;font-size:13px;border-radius:10px}

/* chat bubbles */
.bubble{position:absolute;z-index:50;transform:translateX(-50%);max-width:124px;background:#fff;color:var(--ink);font-size:11.5px;line-height:1.25;font-weight:500;padding:5px 9px;border-radius:12px;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:left 1.2s ease,bottom 1.2s ease;animation:pop .3s ease-out}
.bubble span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;width:max-content;max-width:106px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:2px}
.bubble.me{background:#fff1ea}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.say{display:flex;gap:8px;margin:12px 0 4px}
.say .text{flex:1;font-size:15px;padding:10px 12px}
.say .btn{padding:10px 16px}
.say-mine{margin:2px 2px 0}
.msg-note{color:#5d5546;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* sick / injured */
.cond{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#ece3d2;border-radius:14px;padding:4px;margin:12px auto 0;max-width:360px}
.cond button{border:0;background:transparent;border-radius:10px;padding:8px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.cond button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.m-rest{animation:breathe 4.5s ease-in-out infinite}
.cond-note{color:#7a6a2f}
/* the cart */
.cart{position:absolute;bottom:18px;z-index:16;transform:translateX(-50%);height:calc(var(--rw) * 1.2);transition:left 1.2s ease}
.cart .riders{position:absolute;left:6px;right:20px;bottom:calc(14px + var(--rw) * .27);display:flex;justify-content:center;gap:0;z-index:1}
.cart .rider{width:var(--rw);margin:0 calc(var(--rw) * -.09)}
.cart .rider svg{width:100%;height:auto;display:block}
.cart .box{position:absolute;left:2px;right:18px;bottom:14px;height:calc(var(--rw) * .42);z-index:2;border-radius:6px 6px 10px 10px;
  background:repeating-linear-gradient(90deg,#b77a48 0 18px,#a56b3d 18px 20px);border:2px solid #7a4b2a;box-shadow:inset 0 4px 0 rgba(255,255,255,.15)}
.cart .handle{position:absolute;right:0;bottom:calc(14px + var(--rw) * .2);width:22px;height:4px;background:#7a4b2a;border-radius:2px;transform:rotate(-12deg);z-index:2}
.cart .hitch{position:absolute;right:-3px;bottom:calc(14px + var(--rw) * .2 + 3px);width:6px;height:6px;border-radius:50%;background:#7a4b2a;z-index:2}
.cart .wheel{position:absolute;bottom:0;width:28px;height:28px;border-radius:50%;background:#5a3a22;border:3px solid #3e2716;z-index:3;animation:spin .9s linear infinite}
.cart .wheel i{position:absolute;inset:3px;border-radius:50%;background:conic-gradient(#c8935f 0 8deg,transparent 8deg 90deg,#c8935f 90deg 98deg,transparent 98deg 180deg,#c8935f 180deg 188deg,transparent 188deg 270deg,#c8935f 270deg 278deg,transparent 278deg)}
.cart .w1{left:10%}.cart .w2{right:24%}
.cart.parked .wheel{animation:none}
.scene .tag.cart-tag{z-index:41;max-width:none}
.cart-note{top:auto;bottom:118px;font-size:12px}
@media (prefers-reduced-motion:reduce){.cart .wheel,.m-rest{animation:none}}

/* pet animation */
.pet-anim{transform-box:fill-box;transform-origin:50% 100%}
.m-happy{animation:bounce 1.1s ease-in-out infinite}
.m-content{animation:breathe 3.2s ease-in-out infinite}
.m-hungry{animation:sway 2.4s ease-in-out infinite}
.m-starving{animation:shiver .25s linear infinite}
.m-fainting{transform:rotate(-78deg) translate(10px,6px);transform-origin:50% 100%}
.m-dead{animation:ghost 3s ease-in-out infinite;opacity:.55}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-14px) scale(.97,1.03)}55%{transform:translateY(0) scale(1.05,.95)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.98)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes ghost{0%,100%{transform:translateY(-6px)}50%{transform:translateY(-16px)}}
@media (prefers-reduced-motion:reduce){.m-happy,.m-content,.m-hungry,.m-starving,.m-dead{animation:none}}
